<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>Trigon</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        height: 100%;
        height: 100dvh;
        height: -webkit-fill-available;
        height: var(--app-height, 100dvh);
        overflow: hidden;
        background: #0a0a12;
        touch-action: none;
      }
      /* Phaser FIT reads parent offsetWidth/offsetHeight — % height can be 0 before layout; fixed inset fixes blank canvas */
      #game-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        height: var(--app-height, 100dvh);
        overflow: hidden;
      }
      #game-container canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
